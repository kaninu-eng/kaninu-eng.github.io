<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>ARCHIVE Portfolio</title>
<style>
:root{--dvh:100vh}
@supports (height:100dvh){:root{--dvh:100dvh}}
@media(max-width:900px){@supports (height:100svh){:root{--dvh:100svh}}}
html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
.viewer{width:100%;height:100vh;height:var(--dvh);position:relative;overflow:hidden;background:#000;color:#aaa;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.portfolio-scroll{position:relative;width:100%;height:100%;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.portfolio-scroll::-webkit-scrollbar{display:none}
.portfolio-page{width:100%;height:100vh;height:var(--dvh);min-height:100vh;min-height:var(--dvh);display:flex;align-items:center;justify-content:center;scroll-snap-align:start;scroll-snap-stop:normal;background:#000;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);contain:layout paint style;content-visibility:auto;contain-intrinsic-size:auto 100vh;contain-intrinsic-size:auto var(--dvh)}
.slide-stage{--slide-ratio:2.41351;flex:none;width:min(100%,calc(var(--dvh) * var(--slide-ratio)));aspect-ratio:var(--slide-ratio);max-height:100vh;max-height:var(--dvh);position:relative;overflow:hidden;background:#fff}
.loading-label{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;background:#fff;color:#aaa;font-size:10px;letter-spacing:.18em;pointer-events:none}
.loading-label.retry{pointer-events:auto;cursor:pointer}
.slide-frame{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);border:0;background:#000;opacity:0;pointer-events:none}
.slide-image{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);object-fit:fill;display:block;background:#000;opacity:0}
.slide-image.is-ready{opacity:1}
.slide-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#000;opacity:0}
.slide-video.is-ready{opacity:1}
.slide-frame.is-ready{opacity:1}
.slide-frame.is-video{pointer-events:auto}
.scroll-shield{position:absolute;inset:0;z-index:2;background:transparent;touch-action:pan-y pinch-zoom}
.video-scroll-edges{position:absolute;inset:0;z-index:2;pointer-events:none}
.video-edge{position:absolute;pointer-events:auto;background:transparent;touch-action:pan-y pinch-zoom;top:8%;bottom:18%;width:7%}
.video-edge-left{left:0}.video-edge-right{right:0}
.counter{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom));z-index:5;font-size:10px;letter-spacing:.08em;color:rgba(190,190,190,.72);pointer-events:none}
.fullscreen-button{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));z-index:6;width:48px;height:48px;transform:translateX(-50%);border:0;border-radius:4px;padding:0;background:rgba(0,0,0,.22);color:rgba(220,220,220,.72);font:26px/48px Arial,Helvetica,sans-serif;text-align:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fullscreen-button:hover,.fullscreen-button:focus-visible{color:#fff;background:rgba(0,0,0,.36);outline:none}
.status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#777;font-size:11px;letter-spacing:.14em;z-index:10;text-align:center;padding:24px}
.status.retry{cursor:pointer}
.scrubber{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));z-index:8;transform:translateX(-50%);width:min(72vw,760px);padding:7px 12px 8px;border-radius:8px;background:rgba(0,0,0,.24);transition:opacity .18s ease;touch-action:none}
.scrubber-label{height:15px;text-align:center;color:rgba(235,235,235,.8);font-size:9px;line-height:15px;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.scrubber-range{display:block;width:100%;height:18px;margin:0;accent-color:#ddd;cursor:pointer}
.viewer.is-fullscreen .scrubber{display:none}
.viewer.is-fullscreen .counter{bottom:max(14px,env(safe-area-inset-bottom))}
.viewer:not(.is-fullscreen) .fullscreen-button{bottom:max(48px,calc(env(safe-area-inset-bottom) + 48px))}
.viewer:not(.is-fullscreen) .counter{bottom:max(54px,calc(env(safe-area-inset-bottom) + 54px))}
@media(max-width:900px){
.viewer,.portfolio-scroll{height:100vh;height:var(--dvh)}
.portfolio-scroll{scroll-behavior:auto;touch-action:pan-y pinch-zoom;scroll-snap-type:none;padding-bottom:58px}
.portfolio-page{height:auto;min-height:0;content-visibility:visible;contain:layout paint style;scroll-snap-align:none;padding:1px env(safe-area-inset-right,0px) 1px env(safe-area-inset-left,0px)}
.slide-stage{max-height:none;width:100%}
.viewer.is-fullscreen .portfolio-scroll{scroll-snap-type:y mandatory;padding-bottom:0}
.viewer.is-fullscreen .portfolio-page{height:100vh;height:var(--dvh);min-height:100vh;min-height:var(--dvh);scroll-snap-align:start;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.viewer.is-fullscreen .slide-stage{width:min(100%,calc(var(--dvh) * var(--slide-ratio)));max-height:100vh;max-height:var(--dvh)}
.scrubber{width:calc(100vw - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));bottom:max(6px,env(safe-area-inset-bottom));padding:5px 10px 6px}
.scrubber-label{font-size:9px}
.counter{right:max(12px,env(safe-area-inset-right,0px))}
.fullscreen-button{width:46px;height:46px;font-size:25px;line-height:46px}
.viewer:not(.is-fullscreen) .fullscreen-button{bottom:max(45px,calc(env(safe-area-inset-bottom) + 45px))}
.viewer:not(.is-fullscreen) .counter{bottom:max(50px,calc(env(safe-area-inset-bottom) + 50px))}
}
@media(prefers-reduced-motion:reduce){.portfolio-scroll{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="color:#aaa;font:12px Arial,sans-serif;letter-spacing:.14em;text-align:center;padding:24px">PLEASE ENABLE JAVASCRIPT TO VIEW THE PORTFOLIO</p></noscript>
<script>
(()=>{
const CONTROL_URL='https://script.google.com/macros/s/AKfycbyIlZriI8wvw-VWHWkUva8TSCvmYn04JCAyoGbnRqNWpIvRMjS7BmApbIGm_0spKqkMAw/exec';
const MENU_SLIDE_IDS=new Set(['g409f5d1cb20_0_0','g3fb86268bcb_0_0']);
const PRESENTATION_RATIOS=new Map([['1tcOfury8BdHsMKrkfXG3SJZme9LU8NoxhpRDzBnNuSE',28575000/11470050]]);
const VIDEO_SLIDES=new Set([
'1ZdriVfkQNIfcbwqQ9zNGcxKRHwC4YhKI_zsSa5ewxgc:g3b773260940_0_54',
'1xml51vsR09JDbgRwIyvT1Gf8Cfj9v-P9RdGGWJKWG_A:g3b1f4e5e68d_0_3',
'154LAAGv-ZC_tndMA8ZZsOid7MXX75is3U0dn1Wnux0o:g3fb98553a14_0_0',
'1QRraD6xGY3ED4U-hVZOSh6QHXjOh4zle8fO1zhSKfvo:g3fb9b795649_0_115'
]);
// Optional: self-hosted MP4 files for video slides. Native <video> starts far faster than Google's
// slide embed. Key = presentationId + ':' + slideId, value = path to the .mp4 (see notes).
// If a file is missing or fails, the slide automatically falls back to the Google embed.
const VIDEO_FILES={
// '1ZdriVfkQNIfcbwqQ9zNGcxKRHwC4YhKI_zsSa5ewxgc:g3b773260940_0_54':'/assets/videos/project-1.mp4',
};
const app=document.getElementById('app');
const isMobile=matchMedia('(max-width:900px)').matches || (navigator.maxTouchPoints>0 && matchMedia('(pointer:coarse)').matches);
const memoryGB=Number(navigator.deviceMemory||0);
const lowMemory=memoryGB>0&&memoryGB<=4;
const KEEP_BEHIND=isMobile?2:1;
const KEEP_AHEAD=isMobile?3:(lowMemory?3:5);
const IDLE_AHEAD=isMobile?0:(lowMemory?1:2);
const VIDEO_BEHIND=1;
const VIDEO_AHEAD=1;
const PROGRESS_KEY='archivePortfolioProgress';
let assetVersion='1';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
app.innerHTML='<div class="status">LOADING PORTFOLIO</div>';
if('serviceWorker' in navigator){
const regSW=()=>navigator.serviceWorker.register('/sw.js').catch(()=>{});
if(document.readyState==='complete')regSW();else window.addEventListener('load',regSW,{once:true});
}

const normalize=projects=>(projects||[]).flatMap(p=>{
if(!p||!p.name||!p.presentationId||!Array.isArray(p.slideIds))return[];
const slideIds=p.slideIds.filter(id=>id&&!MENU_SLIDE_IDS.has(id));
return slideIds.length?[{name:p.name,presentationId:p.presentationId,slideIds}]:[];
});

function cachedProjects(){
try{
const raw=JSON.parse(lsGet('archivePortfolioFeed')||'[]');
if(raw&&raw.assetVersion)assetVersion=String(raw.assetVersion);
return normalize(Array.isArray(raw)?raw:(raw.projects||[]));
}catch(_){return[]}
}
async function loadFeed(url,opts){
const r=await fetch(url,opts);
if(!r.ok)throw new Error('feed');
const data=await r.json();
const projects=normalize(data.projects);
if(!data.ok||!projects.length)throw new Error('feed');
return {projects,assetVersion:data.assetVersion?String(data.assetVersion):assetVersion};
}
async function fetchFreshProjects(){
let result;
// Primary source: same-origin static manifest generated with the slide cache.
try{result=await loadFeed('/assets/slide-manifest.json',{cache:'no-cache'})}
// Emergency fallback only: live Apps Script control feed.
catch(_){result=await loadFeed(CONTROL_URL+'?t='+Date.now(),{cache:'no-store'})}
assetVersion=result.assetVersion||assetVersion;
lsSet('archivePortfolioFeed',JSON.stringify({
projects:result.projects,
assetVersion,
savedAt:Date.now()
}));
return result.projects;
}

function render(projects){
const slides=projects.flatMap(p=>p.slideIds.map((slideId,localIndex)=>({project:p,slideId,localIndex})));
app.innerHTML='<main class="viewer" aria-label="ARCHIVE portfolio"><div class="portfolio-scroll"></div><div class="counter"></div><button class="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen">⛶</button><div class="scrubber" aria-label="Portfolio navigation"><div class="scrubber-label"></div><input class="scrubber-range" type="range" min="0" step="1" value="0" aria-label="Jump to portfolio page"></div></main>';
const scroller=app.querySelector('.portfolio-scroll');
const counter=app.querySelector('.counter');
const fs=app.querySelector('.fullscreen-button');
const viewer=app.querySelector('.viewer');
const scrubber=app.querySelector('.scrubber');
const scrubberLabel=app.querySelector('.scrubber-label');
const scrubberRange=app.querySelector('.scrubber-range');
scrubberRange.max=String(Math.max(0,slides.length-1));
const sections=[];
const mounted=new Set();
let current=0;
let focus=0;                       // centre of the last mountWindow()
let scrolling=false,pendingVideo=false;
const imageCache=new Map();
const isVid=i=>{const x=slides[i];return !!x&&VIDEO_SLIDES.has(x.project.presentationId+':'+x.slideId)};
const videoInRange=(i,c,slack=0)=>{const d=i-c;return d>=-(VIDEO_BEHIND+slack)&&d<=VIDEO_AHEAD+slack};
// pause a playing video as soon as it scrolls out of view
const videoObserver=('IntersectionObserver' in window)?new IntersectionObserver(es=>{
for(const e of es){if(!e.isIntersecting&&e.target.pause)e.target.pause()}
},{root:scroller,threshold:.25}):{observe(){},unobserve(){}};

function slideImageUrl(item){
return '/assets/slides/'+encodeURIComponent(item.project.presentationId)+'/'+encodeURIComponent(item.slideId)+'.jpg?v='+encodeURIComponent(assetVersion);
}
function googleSlideImageUrl(item,format='jpeg'){
return 'https://docs.google.com/presentation/d/'+item.project.presentationId+'/export/'+format+'?id='+item.project.presentationId+'&pageid='+item.slideId;
}
function prepareImage(item,index,priority='low'){
if(VIDEO_SLIDES.has(item.project.presentationId+':'+item.slideId))return null;
let rec=imageCache.get(index);
if(rec)return rec;
const img=new Image();
img.className='slide-image';
img.alt=item.project.name+' slide '+(item.localIndex+1);
img.decoding='async';
img.loading='eager';
try{img.fetchPriority=priority}catch(_){}
rec={img,state:'loading',source:'static',disposed:false};
rec.promise=new Promise((resolve,reject)=>{
img.addEventListener('load',()=>{rec.state='ready';resolve(img)},{once:true});
img.addEventListener('error',()=>{
if(rec.disposed)return;
if(rec.source==='static'){
rec.source='google-jpeg';
img.src=googleSlideImageUrl(item,'jpeg');
return;
}
if(rec.source==='google-jpeg'){
rec.source='google-png';
img.src=googleSlideImageUrl(item,'png');
return;
}
rec.state='error';
reject(new Error('image'));
},{once:false});
});
imageCache.set(index,rec);
img.src=slideImageUrl(item);
return rec;
}
// forget images far from the reader so memory does not grow while scrolling
function trimImageCache(center){
const behind=isMobile?3:8,ahead=isMobile?7:12;
for(const [i,rec] of [...imageCache]){
if((i<center-behind||i>center+ahead)&&!rec.img.parentNode){
rec.disposed=true;
rec.img.removeAttribute('src');
imageCache.delete(i);
}
}
}

function updateCounter(i){
current=Math.max(0,Math.min(slides.length-1,i));
const s=slides[current];
counter.textContent=s.project.name+' · '+(s.localIndex+1)+' / '+s.project.slideIds.length;
scrubberRange.value=String(current);
scrubberLabel.textContent=s.project.name+' · '+(s.localIndex+1)+' / '+s.project.slideIds.length;
}

function makeLoading(text='LOADING',retry=false){
const d=document.createElement('div');
d.className='loading-label'+(retry?' retry':'');
d.textContent=text;
return d;
}

function makeSlide(item,index){
const key=item.project.presentationId+':'+item.slideId;
const isVideo=VIDEO_SLIDES.has(key);
const section=document.createElement('section');
section.className='portfolio-page';
section.dataset.index=String(index);
section.setAttribute('aria-label',item.project.name+' slide '+(item.localIndex+1)+' of '+item.project.slideIds.length);
const stage=document.createElement('div');
stage.className='slide-stage';
const customRatio=PRESENTATION_RATIOS.get(item.project.presentationId);
if(customRatio)stage.style.setProperty('--slide-ratio',String(customRatio));
stage.appendChild(makeLoading());
section.appendChild(stage);
section._generation=0;
section._timer=null;

if(isMobile&&!isVideo){
const loading=stage.querySelector('.loading-label');
const img=document.createElement('img');
img.className='slide-image';
img.alt=item.project.name+' slide '+(item.localIndex+1);
img.decoding='async';
img.loading=Math.abs(index-initialIndex)<3?'eager':'lazy';
try{img.fetchPriority=Math.abs(index-initialIndex)<2?'high':'auto'}catch(_){}
img.dataset.source='static';

const ready=()=>{
img.classList.add('is-ready');
loading?.remove();
};
img.addEventListener('load',ready,{once:false});
img.addEventListener('error',()=>{
if(img.dataset.source==='static'){
img.dataset.source='google-jpeg';
img.src=googleSlideImageUrl(item,'jpeg');
return;
}
if(img.dataset.source==='google-jpeg'){
img.dataset.source='google-png';
img.src=googleSlideImageUrl(item,'png');
return;
}
const retry=makeLoading('TAP TO RETRY',true);
retry.addEventListener('click',()=>{
img.dataset.source='static';
stage.replaceChildren(img);
img.src=slideImageUrl(item)+'&retry='+Date.now();
},{once:true});
stage.replaceChildren(retry);
},{once:false});
img.src=slideImageUrl(item);
stage.appendChild(img);

section._mount=()=>{
if(img.classList.contains('is-ready'))return;
img.loading='eager';
try{img.fetchPriority='high'}catch(_){}
if(img.complete&&img.naturalWidth)ready();
};
section._unmount=()=>{};
section._staticImage=img;
return section;
}

section._unmount=()=>{
section._generation++;
if(section._timer)clearTimeout(section._timer);
section._timer=null;
stage.replaceChildren(makeLoading());
mounted.delete(index);
};

section._mount=(attempt=0,forceIframe=false)=>{
if(stage.querySelector('iframe,img.slide-image,video.slide-video'))return;
if(isVideo){
// only build heavy video players near the reader, and not in the middle of a fast scroll
if(!videoInRange(index,focus))return;
if(scrolling&&index!==focus){pendingVideo=true;return}
}
mounted.add(index);
const generation=++section._generation;
if(section._timer)clearTimeout(section._timer);
stage.replaceChildren();
const loading=makeLoading();
stage.appendChild(loading);

const done=el=>{
if(section._generation!==generation)return;
if(section._timer)clearTimeout(section._timer);
section._timer=null;
el.classList.add('is-ready');
loading.remove();
};

const mountIframe=()=>{
if(section._generation!==generation)return;
stage.querySelector('img.slide-image')?.remove();
const iframe=document.createElement('iframe');
iframe.className='slide-frame'+(isVideo?' is-video':'');
iframe.title=item.project.name+' slide '+(item.localIndex+1);
iframe.loading='eager';
iframe.allow='autoplay; fullscreen';
iframe.allowFullscreen=true;
iframe.src='https://docs.google.com/presentation/d/'+item.project.presentationId+'/embed?start=false&loop=false&delayms=60000&rm=minimal&slide=id.'+item.slideId+(attempt?'&retry='+Date.now():'');
iframe.addEventListener('load',()=>done(iframe),{once:true});
stage.appendChild(iframe);

if(isVideo){
const edges=document.createElement('div');
edges.className='video-scroll-edges';
edges.setAttribute('aria-hidden','true');
edges.innerHTML='<span class="video-edge video-edge-left"></span><span class="video-edge video-edge-right"></span>';
stage.appendChild(edges);
}else{
const shield=document.createElement('div');
shield.className='scroll-shield';
shield.setAttribute('aria-hidden','true');
stage.appendChild(shield);
}
section._timer=setTimeout(()=>{
if(section._generation!==generation||iframe.classList.contains('is-ready'))return;
if(attempt<1){section._unmount();section._mount(attempt+1,true)}
else{
const retry=makeLoading('TAP TO RETRY',true);
retry.addEventListener('click',()=>{section._unmount();section._mount(0,isVideo)},{once:true});
stage.replaceChildren(retry);
}
},isVideo?30000:(isMobile?9000:15000));
};

const mountVideoFile=src=>{
if(section._generation!==generation)return;
const v=document.createElement('video');
v.className='slide-video';
v.controls=true;
v.playsInline=true;
v.setAttribute('playsinline','');
v.setAttribute('webkit-playsinline','');
v.preload='metadata';
v.poster=slideImageUrl(item);
v.setAttribute('aria-label',item.project.name+' video');
v.addEventListener('error',()=>{
if(section._generation!==generation||!v.parentNode)return;
videoObserver.unobserve(v);
v.remove();
mountIframe();
},{once:true});
v.src=src;
stage.appendChild(v);
videoObserver.observe(v);
done(v);
};

if(!isVideo&&!forceIframe){
const rec=prepareImage(item,index,index===current?'high':'auto');
const img=rec.img;
stage.appendChild(img);
if(rec.state==='ready'||(img.complete&&img.naturalWidth)){
done(img);
}else{
rec.promise.then(()=>{
if(section._generation===generation&&img.parentNode===stage)done(img);
}).catch(()=>{
if(section._generation!==generation)return;
if(section._timer)clearTimeout(section._timer);
section._timer=null;
img.remove();
mountIframe();
});
section._timer=setTimeout(()=>{
if(section._generation!==generation||img.classList.contains('is-ready'))return;
img.remove();
mountIframe();
},5500);
}
}else if(isVideo&&VIDEO_FILES[key]&&!forceIframe){
mountVideoFile(VIDEO_FILES[key]);
}else{
mountIframe();
}
};
return section;
}

let initialIndex=0;
try{
const saved=JSON.parse(lsGet(PROGRESS_KEY)||'null');
if(saved&&Date.now()-Number(saved.ts||0)<7*24*60*60*1000){
const byKey=slides.findIndex(x=>x.project.presentationId+':'+x.slideId===saved.key);
initialIndex=byKey>=0?byKey:Math.max(0,Math.min(slides.length-1,Number(saved.index||0)));
}
}catch(_){}

slides.forEach((item,i)=>{
const section=makeSlide(item,i);
sections.push(section);
scroller.appendChild(section);
});

let preloadEpoch=0;
let videoWarmed=false;
// open the connection to Google early when a Google-embedded video is coming up
function warmGoogle(center){
if(videoWarmed)return;
for(let i=Math.max(0,center-1);i<=Math.min(slides.length-1,center+2);i++){
if(isVid(i)&&!VIDEO_FILES[slides[i].project.presentationId+':'+slides[i].slideId]){
videoWarmed=true;
const l=document.createElement('link');
l.rel='preconnect';
l.href='https://docs.google.com';
document.head.appendChild(l);
return;
}
}
}
function mountWindow(center){
focus=center;
const epoch=++preloadEpoch;
const start=Math.max(0,center-KEEP_BEHIND);
const end=Math.min(slides.length-1,center+KEEP_AHEAD);
trimImageCache(center);
warmGoogle(center);
for(const i of [...mounted]){
const outOfWindow=!isMobile&&(i<start||i>end+IDLE_AHEAD);
if(outOfWindow||(isVid(i)&&!videoInRange(i,center,1)))sections[i]._unmount();
}
if(!isMobile){
for(const i of [center,center+1]){
if(slides[i]&&!isVid(i))prepareImage(slides[i],i,'high');
}
}
sections[center]?._mount();
if(isMobile){
const vEnd=Math.min(slides.length-1,center+VIDEO_AHEAD);
for(let i=Math.max(0,center-VIDEO_BEHIND);i<=vEnd;i++){
if(i!==center&&isVid(i))sections[i]._mount();
}
return;
}
if(center+1<=end)sections[center+1]._mount();
if(center-1>=start)sections[center-1]._mount();
const queue=[];
for(let i=center+2;i<=end;i++)queue.push(i);
for(let i=center-2;i>=start;i--)queue.push(i);
queue.forEach((i,k)=>setTimeout(()=>{
if(epoch===preloadEpoch&&document.visibilityState==='visible')sections[i]._mount();
},(k+1)*90));
const idle=window.requestIdleCallback||((fn)=>setTimeout(fn,300));
if(IDLE_AHEAD) idle(()=>{
if(epoch!==preloadEpoch||document.visibilityState!=='visible')return;
for(let i=end+1;i<=Math.min(slides.length-1,end+IDLE_AHEAD);i++)sections[i]._mount();
},{timeout:900});
}

const predictive=new IntersectionObserver(entries=>{
for(const e of entries){
if(!e.isIntersecting)continue;
const i=Number(e.target.dataset.index);
sections[i]?._mount();
if(i+1<slides.length)sections[i+1]._mount();
}
},{root:scroller,rootMargin:'120% 0px 220% 0px',threshold:.01});

const active=new IntersectionObserver(entries=>{
if(isMobile)return;
for(const e of entries){
if(e.intersectionRatio>=.58){
const i=Number(e.target.dataset.index);
updateCounter(i);
mountWindow(i);
}
}
},{root:scroller,threshold:[.58]});
sections.forEach(s=>{if(!isMobile){predictive.observe(s);active.observe(s)}});

function findCenterIndex(){
const target=scroller.scrollTop+scroller.clientHeight/2;
let lo=0,hi=sections.length-1;
while(lo<hi){
const mid=(lo+hi)>>1;
const s=sections[mid];
const center=s.offsetTop+s.offsetHeight/2;
if(center<target)lo=mid+1;else hi=mid;
}
let best=lo;
if(best>0){
const a=sections[best-1],b=sections[best];
const da=Math.abs((a.offsetTop+a.offsetHeight/2)-target);
const db=Math.abs((b.offsetTop+b.offsetHeight/2)-target);
if(da<db)best--;
}
return best;
}
// the section at the top edge of the screen
function topIndex(){
const y=scroller.scrollTop+1;
let lo=0,hi=sections.length-1;
while(lo<hi){
const mid=(lo+hi+1)>>1;
if(sections[mid].offsetTop<=y)lo=mid;else hi=mid-1;
}
return lo;
}
// instant jump, even where CSS says scroll-behavior:smooth (works in every browser)
function jumpTo(top){
const st=scroller.style;
st.scrollBehavior='auto';
scroller.scrollTop=top;
requestAnimationFrame(()=>{st.scrollBehavior=''});
}

// Remember WHICH slide (and how far into it) the reader is on, not a pixel offset.
// When the screen rotates or the window is resized every slide changes height, so a pixel
// offset points at a different slide. The anchor lets us land back on the same one.
let anchor={i:initialIndex,f:0},restoring=false,restoreTimer=0,lastW=0,lastH=0;
function saveAnchor(){
if(restoring)return;
if(scroller.clientWidth!==lastW||scroller.clientHeight!==lastH)return;
const i=topIndex(),s=sections[i];
anchor={i,f:Math.max(0,Math.min(1,(scroller.scrollTop-s.offsetTop)/(s.offsetHeight||1)))};
}
function restoreAnchor(){
const s=sections[anchor.i];
if(s)jumpTo(s.offsetTop+anchor.f*s.offsetHeight);
}
function onScrollerResize(){
const w=scroller.clientWidth,h=scroller.clientHeight;
if(w===lastW&&h===lastH)return;
lastW=w;lastH=h;
restoring=true;
restoreAnchor();
clearTimeout(restoreTimer);
// some browsers (iOS Safari) report rotation in several steps, so settle again shortly after
restoreTimer=setTimeout(()=>{
restoreAnchor();
restoring=false;
saveAnchor();
const c=findCenterIndex();
updateCounter(c);
mountWindow(c);
},250);
}
// if the reader starts scrolling themselves, stop fighting them
const cancelRestore=()=>{if(restoring){restoring=false;clearTimeout(restoreTimer)}};
['wheel','touchstart','keydown','pointerdown'].forEach(t=>window.addEventListener(t,cancelRestore,{passive:true,capture:true}));

let scrollRaf=0,scrollTimer=0;
scroller.addEventListener('scroll',()=>{
scrolling=true;
clearTimeout(scrollTimer);
scrollTimer=setTimeout(()=>{
scrolling=false;
if(pendingVideo&&!restoring){pendingVideo=false;mountWindow(current)}
},160);
if(scrollRaf)return;
scrollRaf=requestAnimationFrame(()=>{
scrollRaf=0;
if(restoring)return;
saveAnchor();
if(isMobile){
const i=findCenterIndex();
if(i!==current){updateCounter(i);mountWindow(i)}
}
});
},{passive:true});

updateCounter(initialIndex);
mountWindow(initialIndex);
if(initialIndex>0){
jumpTo(sections[initialIndex]?.offsetTop||0);
requestAnimationFrame(()=>jumpTo(sections[initialIndex]?.offsetTop||0));
}
lastW=scroller.clientWidth;lastH=scroller.clientHeight;
if('ResizeObserver' in window)new ResizeObserver(onScrollerResize).observe(scroller);
else window.addEventListener('resize',onScrollerResize);

function labelFor(i){
const n=Math.max(0,Math.min(slides.length-1,Number(i)||0));
const s=slides[n];
return s.project.name+' · '+(s.localIndex+1)+' / '+s.project.slideIds.length;
}
let scrubbing=false;
scrubberRange.addEventListener('input',()=>{
scrubbing=true;
const n=Math.max(0,Math.min(slides.length-1,Number(scrubberRange.value)||0));
scrubberLabel.textContent=labelFor(n);
if(isMobile)sections[n]?._mount();
});
function commitScrub(){
const n=Math.max(0,Math.min(slides.length-1,Number(scrubberRange.value)||0));
scrubbing=false;
updateCounter(n);
mountWindow(n);
jumpTo(sections[n]?.offsetTop||0);
}
scrubberRange.addEventListener('change',commitScrub);
scrubberRange.addEventListener('pointerup',commitScrub);
scrubberRange.addEventListener('touchend',commitScrub,{passive:true});

function go(i){
const n=Math.max(0,Math.min(slides.length-1,i));
mountWindow(n);
scroller.scrollTo({top:sections[n]?.offsetTop||0,behavior:isMobile?'auto':'smooth'});
}
window.addEventListener('keydown',e=>{
const t=e.target&&e.target.tagName;
if(t==='INPUT'||t==='BUTTON'||t==='VIDEO'||t==='IFRAME')return;
if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}
else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}
else if(e.key==='Home'){e.preventDefault();go(0)}
else if(e.key==='End'){e.preventDefault();go(slides.length-1)}
});

function saveProgress(){
const s=slides[current];
if(s)lsSet(PROGRESS_KEY,JSON.stringify({key:s.project.presentationId+':'+s.slideId,index:current,ts:Date.now()}));
}
document.addEventListener('visibilitychange',()=>{
if(document.visibilityState==='visible')mountWindow(current);
else saveProgress();
});
window.addEventListener('pageshow',()=>{mountWindow(current);});
window.addEventListener('pagehide',saveProgress);

const root=document.documentElement;
const doc=document;
const supported=!!(root.requestFullscreen||root.webkitRequestFullscreen);
if(!supported)fs.style.display='none';
fs.addEventListener('click',async()=>{
try{
if(doc.fullscreenElement)await doc.exitFullscreen();
else if(doc.webkitFullscreenElement&&doc.webkitExitFullscreen)await doc.webkitExitFullscreen();
else if(root.requestFullscreen)await root.requestFullscreen();
else if(root.webkitRequestFullscreen)await root.webkitRequestFullscreen();
}catch(_){}
});
function syncFs(){
const on=!!(doc.fullscreenElement||doc.webkitFullscreenElement);
viewer.classList.toggle('is-fullscreen',on);
anchor={i:current,f:0};
requestAnimationFrame(()=>{jumpTo(sections[current]?.offsetTop||0);mountWindow(current)});
fs.textContent=on?'×':'⛶';
fs.setAttribute('aria-label',on?'Exit fullscreen':'Enter fullscreen');
fs.title=on?'Exit fullscreen':'Fullscreen';
}
doc.addEventListener('fullscreenchange',syncFs);
doc.addEventListener('webkitfullscreenchange',syncFs);
}

fetchFreshProjects().then(render).catch(()=>{
const cached=cachedProjects();
if(cached.length)render(cached);
else{
app.innerHTML='<div class="status retry">PORTFOLIO TEMPORARILY UNAVAILABLE<br><br>TAP TO RETRY</div>';
app.firstElementChild.addEventListener('click',()=>location.reload());
}
});
})();
</script>
</body>
</html>
