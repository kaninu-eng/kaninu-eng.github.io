<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://docs.google.com" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="//googleusercontent.com">
<title>ARCHIVE Portfolio</title>
<style>
html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{font-family:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
.viewer{width:100vw;height:100dvh;position:relative;overflow:hidden;background:#000;color:#aaa;user-select:none}
.portfolio-scroll{width:100%;height:100%;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.portfolio-scroll::-webkit-scrollbar{display:none}
.portfolio-page{width:100%;height:100dvh;min-height:100dvh;display:flex;align-items:center;justify-content:center;scroll-snap-align:start;scroll-snap-stop:normal;background:#000;contain:layout paint style;content-visibility:auto;contain-intrinsic-size:auto 100dvh}
.slide-stage{width:min(100vw,calc(100dvh * 2.41351));aspect-ratio:28575000/11839575;max-height:100dvh;position:relative;overflow:hidden;background:#fff}
.loading-label{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;background:#fff;color:#aaa;font-size:10px;letter-spacing:.18em;pointer-events:none}
.loading-label.retry{pointer-events:auto;cursor:pointer}
.slide-frame{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);border:0;background:#000;opacity:0;pointer-events:none}
.slide-frame.is-ready{opacity:1}
.slide-frame.is-video{pointer-events:auto}
.scroll-shield{position:absolute;inset:0;z-index:2;background:transparent;touch-action:pan-y}
.video-scroll-edges{position:absolute;inset:0;z-index:2;pointer-events:none}
.video-edge{position:absolute;pointer-events:auto;background:transparent;touch-action:pan-y;top:8%;bottom:18%;width:7%}
.video-edge-left{left:0}.video-edge-right{right:0}
.counter{position:fixed;right:16px;bottom:max(14px,env(safe-area-inset-bottom));z-index:5;font-size:10px;letter-spacing:.08em;color:rgba(190,190,190,.72);pointer-events:none}
.fullscreen-button{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));z-index:6;width:48px;height:48px;transform:translateX(-50%);border:0;border-radius:4px;padding:0;background:rgba(0,0,0,.22);color:rgba(220,220,220,.72);font:26px/48px Arial,Helvetica,sans-serif;text-align:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fullscreen-button:hover,.fullscreen-button:focus-visible{color:#fff;background:rgba(0,0,0,.36);outline:none}
.status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#777;font-size:11px;letter-spacing:.14em;z-index:10;text-align:center;padding:24px}
.status.retry{cursor:pointer}
@media(max-width:900px){.viewer,.portfolio-scroll,.portfolio-page{height:100vh;min-height:100vh;height:100svh;min-height:100svh}.portfolio-scroll{scroll-behavior:auto;touch-action:pan-y}.portfolio-page{content-visibility:visible;contain:layout paint style}.slide-stage{max-height:100svh;width:min(100vw,calc(100svh * 2.41351))}.counter{right:12px;bottom:max(12px,env(safe-area-inset-bottom))}.fullscreen-button{bottom:max(10px,env(safe-area-inset-bottom));width:52px;height:52px;font-size:28px;line-height:52px}}
@media(prefers-reduced-motion:reduce){.portfolio-scroll{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
const CONTROL_URL='https://script.google.com/macros/s/AKfycbyIlZriI8wvw-VWHWkUva8TSCvmYn04JCAyoGbnRqNWpIvRMjS7BmApbIGm_0spKqkMAw/exec';
const MENU_SLIDE_IDS=new Set(['g409f5d1cb20_0_0','g3fb86268bcb_0_0']);
const PRESENTATION_RATIOS=new Map([['1tcOfury8BdHsMKrkfXG3SJZme9LU8NoxhpRDzBnNuSE',28575000/11470050]]);
const VIDEO_SLIDES=new Set([
'1ZdriVfkQNIfcbwqQ9zNGcxKRHwC4YhKI_zsSa5ewxgc:g3b773260940_0_54',
'1xml51vsR09JDbgRwIyvT1Gf8Cfj9v-P9RdGGWJKWG_A:g3b1f4e5e68d_0_3',
'154LAAGv-ZC_tndMA8ZZsOid7MXX75is3U0dn1Wnux0o:g3fb98553a14_0_0',
'1QRraD6xGY3ED4U-hVZOSh6QHXjOh4zle8fO1zhSKfvo:g3fb9b795649_0_115'
]);
const app=document.getElementById('app');
const isMobile=matchMedia('(max-width:900px)').matches || (navigator.maxTouchPoints>0 && matchMedia('(pointer:coarse)').matches);
const memoryGB=Number(navigator.deviceMemory||0);
const lowMemory=memoryGB>0&&memoryGB<=4;
const KEEP_BEHIND=1;
const KEEP_AHEAD=isMobile?1:(lowMemory?3:5);
const IDLE_AHEAD=isMobile?0:(lowMemory?1:2);
const MOBILE_LOAD_DELAY=450;
const PROGRESS_KEY='archivePortfolioSessionProgress';
app.innerHTML='<div class="status">LOADING PORTFOLIO</div>';

const normalize=projects=>(projects||[]).flatMap(p=>{
if(!p||!p.name||!p.presentationId||!Array.isArray(p.slideIds))return[];
const slideIds=p.slideIds.filter(id=>id&&!MENU_SLIDE_IDS.has(id));
return slideIds.length?[{name:p.name,presentationId:p.presentationId,slideIds}]:[];
});

function cachedProjects(){
try{
const raw=JSON.parse(localStorage.getItem('archivePortfolioFeed')||'[]');
return normalize(Array.isArray(raw)?raw:(raw.projects||[]));
}catch(_){return[]}
}
async function fetchFreshProjects(){
const r=await fetch(CONTROL_URL+'?t='+Date.now(),{cache:'no-store'});
if(!r.ok)throw new Error('feed');
const data=await r.json();
const projects=normalize(data.projects);
if(!data.ok||!projects.length)throw new Error('feed');
localStorage.setItem('archivePortfolioFeed',JSON.stringify({projects,savedAt:Date.now()}));
return projects;
}

function render(projects){
const slides=projects.flatMap(p=>p.slideIds.map((slideId,localIndex)=>({project:p,slideId,localIndex})));
app.innerHTML='<main class="viewer" aria-label="ARCHIVE portfolio"><div class="portfolio-scroll"></div><div class="counter"></div><button class="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen">⛶</button></main>';
const scroller=app.querySelector('.portfolio-scroll');
const counter=app.querySelector('.counter');
const fs=app.querySelector('.fullscreen-button');
const sections=[];
const mounted=new Set();
let current=0;

function updateCounter(i){
current=Math.max(0,Math.min(slides.length-1,i));
const s=slides[current];
counter.textContent=s.project.name+' · '+(s.localIndex+1)+' / '+s.project.slideIds.length;
try{sessionStorage.setItem(PROGRESS_KEY,JSON.stringify({key:s.project.presentationId+':'+s.slideId,index:current,ts:Date.now()}));}catch(_){}
}

function makeLoading(text='LOADING',retry=false){
const d=document.createElement('div');
d.className='loading-label'+(retry?' retry':'');
d.textContent=text;
return d;
}

function makeSlide(item,index){
const key=item.project.presentationId+':'+item.slideId;
const isVideo=VIDEO_SLIDES.has(key);
const section=document.createElement('section');
section.className='portfolio-page';
section.dataset.index=String(index);
section.setAttribute('aria-label',item.project.name+' slide '+(item.localIndex+1)+' of '+item.project.slideIds.length);
const stage=document.createElement('div');
stage.className='slide-stage';
const customRatio=PRESENTATION_RATIOS.get(item.project.presentationId);
if(customRatio){stage.style.aspectRatio=String(customRatio);stage.style.width='min(100vw,calc('+(isMobile?'100svh':'100dvh')+' * '+customRatio+'))';}
stage.appendChild(makeLoading());
section.appendChild(stage);
section._generation=0;
section._timer=null;

section._unmount=()=>{
section._generation++;
if(section._timer)clearTimeout(section._timer);
section._timer=null;
stage.replaceChildren(makeLoading());
mounted.delete(index);
};

section._mount=(attempt=0)=>{
if(stage.querySelector('iframe'))return;
mounted.add(index);
const generation=++section._generation;
if(section._timer)clearTimeout(section._timer);
stage.replaceChildren();
const loading=makeLoading();
stage.appendChild(loading);
const iframe=document.createElement('iframe');
iframe.className='slide-frame'+(isVideo?' is-video':'');
iframe.title=item.project.name+' slide '+(item.localIndex+1);
iframe.loading='eager';
iframe.allow='autoplay; fullscreen';
iframe.allowFullscreen=true;
iframe.src='https://docs.google.com/presentation/d/'+item.project.presentationId+'/embed?start=false&loop=false&delayms=60000&rm=minimal&slide=id.'+item.slideId+(attempt?'&retry='+Date.now():'');
iframe.addEventListener('load',()=>{
if(section._generation!==generation)return;
if(section._timer)clearTimeout(section._timer);
section._timer=null;
iframe.classList.add('is-ready');
loading.remove();
},{once:true});
stage.appendChild(iframe);

if(isVideo){
const edges=document.createElement('div');
edges.className='video-scroll-edges';
edges.setAttribute('aria-hidden','true');
edges.innerHTML='<span class="video-edge video-edge-left"></span><span class="video-edge video-edge-right"></span>';
stage.appendChild(edges);
}else{
const shield=document.createElement('div');
shield.className='scroll-shield';
shield.setAttribute('aria-hidden','true');
stage.appendChild(shield);
}

section._timer=setTimeout(()=>{
if(section._generation!==generation||iframe.classList.contains('is-ready'))return;
if(attempt<1){
section._unmount();
section._mount(attempt+1);
}else{
if(section._timer)clearTimeout(section._timer);
section._timer=null;
const retry=makeLoading('TAP TO RETRY',true);
retry.addEventListener('click',()=>{
section._unmount();
section._mount(0);
},{once:true});
stage.replaceChildren(retry);
}
},isMobile?10000:15000);
};
return section;
}

slides.forEach((item,i)=>{
const section=makeSlide(item,i);
sections.push(section);
scroller.appendChild(section);
});

let preloadEpoch=0;
function mountWindow(center){
const epoch=++preloadEpoch;
const start=Math.max(0,center-KEEP_BEHIND);
const end=Math.min(slides.length-1,center+KEEP_AHEAD);
for(const i of [...mounted]){
if(i<start||i>end+IDLE_AHEAD)sections[i]._unmount();
}
sections[center]?._mount();
if(isMobile){
if(center-1>=start)sections[center-1]._mount();
if(center+1<=end)setTimeout(()=>{
if(epoch===preloadEpoch&&document.visibilityState==='visible')sections[center+1]._mount();
},MOBILE_LOAD_DELAY);
return;
}
if(center+1<=end)sections[center+1]._mount();
if(center-1>=start)sections[center-1]._mount();
const queue=[];
for(let i=center+2;i<=end;i++)queue.push(i);
for(let i=center-2;i>=start;i--)queue.push(i);
queue.forEach((i,k)=>setTimeout(()=>{
if(epoch===preloadEpoch&&document.visibilityState==='visible')sections[i]._mount();
},(k+1)*90));
const idle=window.requestIdleCallback||((fn)=>setTimeout(fn,300));
if(IDLE_AHEAD) idle(()=>{
if(epoch!==preloadEpoch||document.visibilityState!=='visible')return;
for(let i=end+1;i<=Math.min(slides.length-1,end+IDLE_AHEAD);i++)sections[i]._mount();
},{timeout:900});
}

const predictive=new IntersectionObserver(entries=>{
for(const e of entries){
if(!e.isIntersecting)continue;
const i=Number(e.target.dataset.index);
sections[i]?._mount();
if(i+1<slides.length)sections[i+1]._mount();
}
},{root:scroller,rootMargin:'120% 0px 220% 0px',threshold:.01});

const active=new IntersectionObserver(entries=>{
for(const e of entries){
if(e.intersectionRatio>=.58){
const i=Number(e.target.dataset.index);
updateCounter(i);
mountWindow(i);
}
}
},{root:scroller,threshold:[.58]});
sections.forEach(s=>{if(!isMobile)predictive.observe(s);active.observe(s)});
let initialIndex=0;
try{
const saved=JSON.parse(sessionStorage.getItem(PROGRESS_KEY)||'null');
if(saved&&Date.now()-Number(saved.ts||0)<6*60*60*1000){
const byKey=slides.findIndex(s=>s.project.presentationId+':'+s.slideId===saved.key);
initialIndex=byKey>=0?byKey:Math.max(0,Math.min(slides.length-1,Number(saved.index||0)));
}
}catch(_){}
updateCounter(initialIndex);
mountWindow(initialIndex);
if(initialIndex>0)requestAnimationFrame(()=>{scroller.scrollTop=initialIndex*scroller.clientHeight;});

function go(i){
const n=Math.max(0,Math.min(slides.length-1,i));
mountWindow(n);
sections[n]?.scrollIntoView({behavior:'smooth',block:'start'});
}
window.addEventListener('keydown',e=>{
if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}
else if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}
else if(e.key==='Home'){e.preventDefault();go(0)}
else if(e.key==='End'){e.preventDefault();go(slides.length-1)}
});

document.addEventListener('visibilitychange',()=>{
if(document.visibilityState==='visible')mountWindow(current);
});
window.addEventListener('pageshow',()=>{mountWindow(current);});
window.addEventListener('pagehide',()=>{
try{
const s=slides[current];
if(s)sessionStorage.setItem(PROGRESS_KEY,JSON.stringify({key:s.project.presentationId+':'+s.slideId,index:current,ts:Date.now()}));
}catch(_){}
});

const root=document.documentElement;
const doc=document;
const supported=!!(root.requestFullscreen||root.webkitRequestFullscreen);
if(!supported)fs.style.display='none';
fs.addEventListener('click',async()=>{
try{
if(doc.fullscreenElement)await doc.exitFullscreen();
else if(doc.webkitFullscreenElement&&doc.webkitExitFullscreen)await doc.webkitExitFullscreen();
else if(root.requestFullscreen)await root.requestFullscreen();
else if(root.webkitRequestFullscreen)await root.webkitRequestFullscreen();
}catch(_){}
});
function syncFs(){
const on=!!(doc.fullscreenElement||doc.webkitFullscreenElement);
fs.textContent=on?'×':'⛶';
fs.setAttribute('aria-label',on?'Exit fullscreen':'Enter fullscreen');
fs.title=on?'Exit fullscreen':'Fullscreen';
}
doc.addEventListener('fullscreenchange',syncFs);
doc.addEventListener('webkitfullscreenchange',syncFs);
}

const projectSignature=projects=>JSON.stringify(projects.map(p=>[p.name,p.presentationId,p.slideIds]));
const cached=cachedProjects();
if(cached.length){
render(cached);
fetchFreshProjects().catch(()=>{});
}else{
fetchFreshProjects().then(render).catch(()=>{
app.innerHTML='<div class="status retry">PORTFOLIO TEMPORARILY UNAVAILABLE<br><br>TAP TO RETRY</div>';
app.firstElementChild.addEventListener('click',()=>location.reload());
});
}
})();
</script>
</body>
</html>
